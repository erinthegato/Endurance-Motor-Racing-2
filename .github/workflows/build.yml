name: Build Vita + PC edition + tests

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: publish a release with this version tag (e.g. v1.0); empty for a plain build
        default: ""

# builds on main run one at a time, so each release gets the next version number
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the version this build would be released as: the latest release plus one (v1.0 -> v1.1), or the
  # one typed in Run workflow; the Vita app version (param.sfo) follows it: v1.1 -> 01.01
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      app: ${{ steps.v.outputs.app }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.release }}
        run: |
          # (no release yet: gh prints its Not Found reply, so check the answer looks like a tag)
          last=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name 2>/dev/null) || last=
          echo "$last" | grep -qE '^v[0-9]+(\.[0-9]+)?$' || last=
          if [ -n "$WANT" ]; then tag="$WANT"; elif [ -z "$last" ]; then tag=v2.0; else
            maj=$(echo "${last#v}" | cut -d. -f1); min=$(echo "${last#v}" | cut -d. -f2)
            tag="v$maj.$((min + 1))"
          fi
          maj=$(echo "${tag#v}" | cut -d. -f1); min=$(echo "${tag#v}" | cut -d. -f2)
          app=$(printf "%02d.%02d" "$maj" "${min:-0}")
          echo "last release $last, this build $tag (app $app)"
          echo "tag=$tag" >> $GITHUB_OUTPUT; echo "app=$app" >> $GITHUB_OUTPUT

  vita:
    needs: version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: |
          (apk add --no-cache git cmake make bash python3 2>/dev/null || (apt-get update && apt-get install -y git cmake make python3)) || true
          ls $VITASDK/arm-vita-eabi/lib | grep -i -E "vitashark|ShaccCgExt" || echo "vitaShaRK not preinstalled"
      - uses: actions/checkout@v5
      - name: vitaShaRK (the runtime shader compiler, if the image lacks it)
        run: |
          if [ ! -f $VITASDK/arm-vita-eabi/lib/libvitashark.a ] || [ ! -f $VITASDK/arm-vita-eabi/lib/libSceShaccCgExt.a ]; then
            git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm && cd /tmp/vdpm && ./vdpm vitaShaRK SceShaccCgExt
          fi
      - name: zlib (packed models, if the image lacks it)
        run: |
          if [ ! -f $VITASDK/arm-vita-eabi/lib/libz.a ]; then
            [ -d /tmp/vdpm ] || git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
            cd /tmp/vdpm && ./vdpm zlib
          fi
      - name: Build VPK
        run: |
          cmake -S vita -B build-vita -DCMAKE_BUILD_TYPE=Release -DFL_APP_VER=${{ needs.version.outputs.app }}
          cmake --build build-vita -j4
          ls -la build-vita/*.vpk build-vita/*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: EnduranceMotorRacing2-Vita
          path: build-vita/EnduranceMotorRacing2.vpk
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: EnduranceMotorRacing2-music
          path: build-vita/EnduranceMotorRacing2-music.zip
          compression-level: 0

  # PC edition (Windows): SDL2 + OpenGL, built with MSYS2 MinGW64 -> a zip with the program, the game's
  # files (DATA, HD and the PC's own PC/ set) and the DLLs it needs. Made for streaming from the PC to
  # Moonlight on the PS Vita (Sunshine on the PC).
  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            zip
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -k 0
      - name: Package (program, game files and the DLLs it needs)
        run: |
          mkdir -p dist/EnduranceMotorRacing2
          cp build/EnduranceMotorRacing2.exe dist/EnduranceMotorRacing2/
          cp -r DATA HD dist/EnduranceMotorRacing2/
          [ -d PC ] && cp -r PC dist/EnduranceMotorRacing2/ || true
          # every MinGW DLL the program loads (SDL2, zlib, and whatever they need)
          ldd build/EnduranceMotorRacing2.exe | grep -i mingw64 | awk '{print $3}' | sort -u | xargs -I{} cp {} dist/EnduranceMotorRacing2/
          cd dist && zip -qr ../EnduranceMotorRacing2-Windows.zip EnduranceMotorRacing2 && cd .. && ls -la EnduranceMotorRacing2-Windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: EnduranceMotorRacing2-Windows
          path: EnduranceMotorRacing2-Windows.zip
          compression-level: 0

  # the same program built on Linux (a compile check, and it runs there too)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev zlib1g-dev cmake
      - name: Build (compile check)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ls -la build/EnduranceMotorRacing2

  pc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build PC test (address + UB sanitizer)
        run: |
          dpkg -s zlib1g-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zlib1g-dev)
          make -f Makefile.pc asan
      - name: Data files laid out as expected (every file walked to its end, turned round and back)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan swapcheck DATA HD PC 2>/dev/null | tail -3
      - name: Menus
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: mkdir -p shots && ./emr_test_asan menus shots
      - name: The intro
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan intro shots 2>&1 | tail -4
      - name: Headquarters, main menu and showroom
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan hq shots 2>&1 | grep -E "picked|after"
      - name: Classes stay apart (teams, careers per class)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan eralock x 2>/dev/null | grep -E "^era"
      - name: Main menu touch skip, headquarters theme
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan touchskip x 2>/dev/null | grep -vE "^track"
      - name: No overlaps (barriers, terrain and trackside objects at every circuit)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan overlaps all 2>/dev/null
      - name: One lap at every circuit (both classes)
        env:
          ASAN_OPTIONS: detect_leaks=0
          EMR_WX: 1
        run: |
          i=0
          for t in lusail imola silverstone spa lemans interlagos cota fuji bahrain; do
            car=$(( (i % 2) * 10 + (i % 7) )); i=$((i+1))
            ./emr_test_asan race $t $car 1 7 shots 20 | grep -E "^P1 |player" | head -2
          done
      - name: Races with race control (rain, safety car / FCY, pit stops, driver changes)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          EMR_WX=3 ./emr_test_asan race spa 2 4 11 shots | grep -E "^P1 |SAFETY|FULL COURSE|SLOW ZONE|Stop" | head -8
          EMR_WX=1 EMR_MIN=6 ./emr_test_asan race lemans 13 99 19 shots | grep -E "^P1 |Stop|driver" | head -8
      - name: Time trial (ghost saved and reloaded)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./emr_test_asan timetrial 3 2 3 shots 2>&1 | grep -E "^lap|reload"
      - name: Team manager (orders, a stop on the manager's plan, DRIVE, no button reaches the car)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          ./emr_test_asan manager imola 2 shots 2>&1 | grep -E "^manager"
      - name: Strong steering help never spins (both classes, abuse at Spa)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./emr_test_asan nospin spa 3 2
          ./emr_test_asan nospin spa 11 2
          ./emr_test_asan difflap imola 0
          ./emr_test_asan garagesight x > /dev/null 2>&1 || { echo "garagesight failed"; exit 1; }
          ./emr_test_asan flyspawn x > /dev/null 2>&1 || { echo "flyspawn failed"; exit 1; }
          ./emr_test_asan memcycle x > /dev/null 2>&1 || { echo "memcycle failed"; exit 1; }
          ./emr_test_asan careereng x > /dev/null 2>&1 || { echo "careereng failed"; exit 1; }
          ./emr_test_asan practiceruns x > /dev/null 2>&1 || { echo "practiceruns failed"; exit 1; }
      - name: Pit stop hand-over to a team-mate, career race lengths
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          EMR_WX=1 ./emr_test_asan teamswap imola 4 shots 2>&1 | grep -E "^teamswap"
          ./emr_test_asan careerlen shots 2>&1 | grep -E "^careerlen"
      - name: Physics (air / track temperature by the clock, each tyre's wear, saves, low ride bottoming)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          ./emr_test_asan temps x 2>/dev/null | grep -vE "^track"
          ./emr_test_asan tyrewear imola 4 2>/dev/null | grep -E "^tyrewear"
          EMR_CH="0 1 2" ./emr_test_asan physlap spa 0 3 2>/dev/null | grep -E "best|bottomed"
      - name: Cars, replay, steering help
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./emr_test_asan cars shots
          ./emr_test_asan replay fuji shots 2>&1 | grep -E "recorded|did not|back on"
          for h in 0 1; do ./emr_test_asan steer imola $h; done
      - uses: actions/upload-artifact@v6
        with:
          name: pc-test-shots
          path: shots

  # every push to main is released as the next version (or Run workflow with a release tag), with
  # the game and the music pack, once the Vita build and every test have passed
  # (the Windows zip goes in too when its build worked; a failed PC build doesn't hold up the Vita release)
  release:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release != '') && needs.vita.result == 'success' && needs.pc-test.result == 'success' }}
    needs: [version, vita, pc-test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release notes (the changes since the last release, then how to install)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name 2>/dev/null) || last=
          {
            echo "## Endurance Motor Racing 2.0 ${{ needs.version.outputs.tag }}"; echo
            echo "### Changes"
            if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
              git log --no-merges --format='- %s' "$last..HEAD"
            else
              git log --no-merges --format='- %s' -1
            fi
            echo
            sed -n '/^### Install/,/^### In this version/p' RELEASE_NOTES.md | sed '$d'
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v6
        with:
          name: EnduranceMotorRacing2-Vita
          path: out
      - uses: actions/download-artifact@v6
        with:
          name: EnduranceMotorRacing2-music
          path: out
      - uses: actions/download-artifact@v6
        if: needs.windows.result == 'success'
        with:
          name: EnduranceMotorRacing2-Windows
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Endurance Motor Racing 2.0 ${{ needs.version.outputs.tag }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/EnduranceMotorRacing2.vpk
            out/EnduranceMotorRacing2-music.zip
            out/EnduranceMotorRacing2-Windows.zip

  # test builds: a push to a branch named test-... is published as a pre-release (tag test-<name>-<run>)
  # once the Vita build works, for trying on the console before it goes to main. Pre-releases never
  # count as the latest release, so the version numbers of the real releases are unchanged.
  test-release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/heads/test-') && github.event_name == 'push' && needs.vita.result == 'success' }}
    needs: [version, vita, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - name: Notes (this branch's latest changes)
        run: |
          {
            echo "## Test build: ${{ github.ref_name }} (not a release)"; echo
            echo "Built from ${{ github.sha }}. Install the .vpk with VitaShell over the game you have (saves are kept)."; echo
            echo "### Latest changes"
            git log --no-merges --format='- %s' -10
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v6
        with:
          name: EnduranceMotorRacing2-Vita
          path: out
      - uses: actions/download-artifact@v6
        if: needs.windows.result == 'success'
        with:
          name: EnduranceMotorRacing2-Windows
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Test: ${{ github.ref_name }} #${{ github.run_number }}"
          body_path: notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            out/EnduranceMotorRacing2.vpk
            out/EnduranceMotorRacing2-Windows.zip
